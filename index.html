<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cut">
<title>구름발 닌자</title>
<style>html,body{margin:0;height:100%;background:#1b2340;color:#fff;font-family:sans-serif}#ld{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;font-size:20px}</style>
</head>
<body>
<div id="ld">구름발 닌자 불러오는 중…</div>
<script>
// 게임 파일(gureumbal-ninja.html)을 읽어서, Firebase 연결 파일을 맨 앞에 끼워 넣고 화면에 띄워요.
fetch('gureumbal-ninja.html', { cache: 'no-cache' })
  .then(function (r) { if (!r.ok) throw 0; return r.text(); })
  .then(function (html) {
    var tag = '<script src="firebase-bridge.js?v=4"><\/script>';
    html = /<head[^>]*>/i.test(html) ? html.replace(/<head[^>]*>/i, function (m) { return m + tag; }) : tag + html;
    document.open(); document.write(html); document.close();
  })
  .catch(function () { document.getElementById('ld').textContent = '게임을 불러오지 못했어요. 새로고침해 주세요'; });
</script>
</body>
</html>
